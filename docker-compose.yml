# Ponto de partida para colocar no ar com HTTPS automático (Caddy).
# Troque resumo.exemplo.com pelo seu domínio e defina ADMIN_EMAIL/ADMIN_SENHA num arquivo .env.
services:
  resumo:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      - resumo-dados:/dados
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    command: caddy reverse-proxy --from resumo.exemplo.com --to resumo:4310
    volumes:
      - caddy-dados:/data
volumes:
  resumo-dados:
  caddy-dados:
